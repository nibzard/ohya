name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: make check
      - run: make build
      - run: make tla

  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: make build

  bench:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache/restore@v4
        with:
          path: perf/bench-baseline.txt
          key: bench-baseline-${{ github.sha }}
          restore-keys: bench-baseline-
      - run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
      - run: make bench-save COUNT=10 OUT=perf/bench.txt
      - name: Diff against the saved baseline
        run: |
          if [ -f perf/bench-baseline.txt ]; then
            make bench-diff BASE=perf/bench-baseline.txt NEW=perf/bench.txt | tee perf/benchstat.txt
            {
              echo "### Benchmark comparison (benchstat)"
              echo
              echo '```'
              cat perf/benchstat.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No saved baseline yet; this run only becomes the new baseline."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: perf/bench.txt
          retention-days: 90
      - name: Refresh the baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp perf/bench.txt perf/bench-baseline.txt
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: perf/bench-baseline.txt
          key: bench-baseline-${{ github.sha }}
