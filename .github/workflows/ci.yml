name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: make check
      - run: make build
      - run: make tla

  # Development executes on Linux, so the macOS job above cannot see
  # Linux-only breakage (CGO, file identity in internal/watch, path
  # handling). Run the same checks on ubuntu-latest; its image ships gcc
  # and make, so CGO needs no extra setup. TLC model checking stays on the
  # macOS job only — it is platform-independent Java, so a second run adds
  # no coverage. The bench job also stays on macOS: its baseline must come
  # from one runner type to be comparable (docs/performance.md).
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: make build

  # Store one benchmark run per commit and diff it against the baseline the
  # main branch last saved. Reports only: runner hardware differs from the
  # reference machine, so a delta is a signal to reproduce locally, not a
  # failing check (docs/performance.md, "Tracking across commits").
  bench:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache/restore@v4
        with:
          path: perf/bench-baseline.txt
          key: bench-baseline-${{ github.sha }}
          restore-keys: bench-baseline-
      - run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
      - run: make bench-save COUNT=10 OUT=perf/bench.txt
      - name: Diff against the saved baseline
        run: |
          if [ -f perf/bench-baseline.txt ]; then
            make bench-diff BASE=perf/bench-baseline.txt NEW=perf/bench.txt | tee perf/benchstat.txt
            {
              echo "### Benchmark comparison (benchstat)"
              echo
              echo '```'
              cat perf/benchstat.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No saved baseline yet; this run only becomes the new baseline."
          fi
      # Upload even when a benchmark fails: bench-save redirects go test's
      # output to perf/bench.txt, so the failure detail is otherwise lost.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: perf/bench.txt
          retention-days: 90
      - name: Refresh the baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp perf/bench.txt perf/bench-baseline.txt
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: perf/bench-baseline.txt
          key: bench-baseline-${{ github.sha }}
