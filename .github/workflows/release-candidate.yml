name: Prepare release candidates
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version, for example v0.1.0
        required: true
        type: string
      ref:
        description: Commit or ref to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: amd64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.revision }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Assert native architecture
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOOS)" = "$EXPECTED_PLATFORM"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
      - run: make check
      - name: Build candidate archive
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        run: scripts/package.sh --version "$CANDIDATE_VERSION"
      - name: Verify the packaged HTTPS bootstrap
        env:
          OHYA_TEST_RELEASE_DIR: ${{ github.workspace }}/dist
        run: go test -tags sqlite_fts5 ./internal/install -run '^TestBootstrapRealReleaseArchive$' -count=1
      - name: Verify real user service and live ingestion
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.platform }}_${{ matrix.arch }}
        run: scripts/native-install-smoke.sh "dist/ohya_${CANDIDATE_VERSION}_${TARGET}.tar.gz"
      - name: Inspect native dependencies
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir dist/inspect
          tar -xzf dist/ohya_*.tar.gz -C dist/inspect
          if [ "$TARGET_PLATFORM" = darwin ]; then
            otool -L dist/inspect/ohya > "dist/native-libraries.$TARGET_PLATFORM-$TARGET_ARCH.txt"
          else
            ldd dist/inspect/ohya > "dist/native-libraries.$TARGET_PLATFORM-$TARGET_ARCH.txt"
          fi
          rm -r dist/inspect
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
  assemble:
    needs: [native, resolve]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.revision }}
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/test_prepare_formula.py
      - name: Verify checksums and prepare formula
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          cat dist/SHA256SUMS.* > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          python3 scripts/prepare-formula.py --version "$CANDIDATE_VERSION" --artifacts dist --output dist/ohya.rb
      - uses: actions/upload-artifact@v7
        with:
          name: unpublished-release-candidates
          path: dist/
          if-no-files-found: error
