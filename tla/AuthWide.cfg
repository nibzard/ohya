\* Wider model: three devices race for two invitations, so one device
\* stays a stranger whatever the interleaving, and a race between
\* consumption and expiry can leave invitations dead before anyone
\* wins them. Two sources explore a device owning several sources
\* while another owns none.
CONSTANTS
  Devices={"d1","d2","d3"}
  Invitations={"i1","i2"}
  Sessions={"c1","c2","c3"}
  Sources={"s1","s2"}
  Annotations={"a1"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SessionLiveHasDevice
INVARIANT InvitationSingleUse
INVARIANT PairingConsistent
INVARIANT InvitationUsedByPairer
INVARIANT NoLiveSessionForRevoked
INVARIANT RevocationIrreversible
INVARIANT OwnershipImmobile
INVARIANT OwnerIsRegistrar
INVARIANT AnnotationWriterFromSession
INVARIANT AnnotationRowTouched
