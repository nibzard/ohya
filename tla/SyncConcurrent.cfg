\* Two sources synchronize concurrently; loss and crashes enabled.
\* Exercises cross-device interleaving: every invariant must hold while
\* the sources commit, retry, and crash independently.
CONSTANTS
  MaxLen=5
  MaxBatch=2
  Sources={"s1","s2"}
  ReliableNet=FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AckLeCommit
INVARIANT StoredPrefixContiguous
INVARIANT EventsCountedOnce
INVARIANT AckedRecordsStored
INVARIANT HubWithinFile
INVARIANT InflightFromAck
INVARIANT WireAckLeCommit
