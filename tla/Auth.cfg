\* The full model: two devices race for two invitations, bind sources,
\* and annotate while the operator revokes under them. Three session
\* slots let both devices hold live sessions and still explore a close
\* and re-establish on a fresh slot.
CONSTANTS
  Devices={"d1","d2"}
  Invitations={"i1","i2"}
  Sessions={"c1","c2","c3"}
  Sources={"s1","s2"}
  Annotations={"a1"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SessionLiveHasDevice
INVARIANT InvitationSingleUse
INVARIANT PairingConsistent
INVARIANT InvitationUsedByPairer
INVARIANT NoLiveSessionForRevoked
INVARIANT RevocationIrreversible
INVARIANT OwnershipImmobile
INVARIANT OwnerIsRegistrar
INVARIANT AnnotationWriterFromSession
INVARIANT AnnotationRowTouched
