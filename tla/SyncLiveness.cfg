\* Two sources on a reliable network: loss and crashes disabled.
\* This model states the liveness assumption (eventual reconnection, so
\* loss stops) and checks under fairness that every appended record is
\* eventually committed and acknowledged.
CONSTANTS
  MaxLen=4
  MaxBatch=2
  Sources={"s1","s2"}
  ReliableNet=TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AckLeCommit
INVARIANT StoredPrefixContiguous
INVARIANT EventsCountedOnce
INVARIANT AckedRecordsStored
INVARIANT HubWithinFile
INVARIANT InflightFromAck
INVARIANT WireAckLeCommit
PROPERTY EventualSync
